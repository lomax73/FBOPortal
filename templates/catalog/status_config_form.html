{% extends "base.html" %}

{% block title %}{% if is_new %}Nuovo stato{% else %}Modifica stato{% endif %} — Portale FBO{% endblock %}

{% block content %}
<h1>{% if is_new %}Nuovo stato{% else %}Modifica stato "{{ status.name }}"{% endif %}</h1>
<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Salva</button>
        <a class="btn btn-secondary" href="{% url 'status-config-list' %}">Annulla</a>
    </form>
</div>
{% endblock %}
